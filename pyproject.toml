[project]
name = "petitepaku"
version = "0.1.0"
description = "Petite Paku: Voice AI Assistant with PNG Animation"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "faster-whisper>=1.2.1",
    "numpy>=2.5.2",
    "pillow>=12.3.0",
    "pyaudio>=0.2.14",
    "requests>=2.34.2",
    "scipy>=1.18.1",
    "sounddevice>=0.5.6",
    "speechrecognition>=3.17.0",
]

[project.optional-dependencies]
cuda = [
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12",
]